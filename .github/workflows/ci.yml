name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push supersedes the previous run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # windows-latest rather than ubuntu because this app targets Windows 11
    # exclusively. It also exercises the exact install path the README asks
    # contributors to run, including npm script quoting under PowerShell.
    runs-on: windows-latest

    strategy:
      # Report both versions rather than cancelling the sibling on first
      # failure - "broken on 24, fine on 22" is the useful signal, and
      # fail-fast would hide half of it.
      fail-fast: false
      matrix:
        # 22 is the floor the README claims; 24 is Active LTS and is what
        # `winget install OpenJS.NodeJS.LTS` actually installs today, so it
        # is what someone following the README will really be running.
        # Node 20 is deliberately absent: it reached end-of-life 2026-03-24.
        node-version: ['22', '24']

    name: build (node ${{ matrix.node-version }})

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `npm ci` rather than `npm install`: installs strictly from the
      # lockfile and fails if package.json and the lockfile disagree.
      - name: Install dependencies
        run: npm ci

      # vite build never reads electron/, so a syntax error in the main
      # process would otherwise ship completely undetected.
      - name: Syntax-check main process
        run: |
          node --check electron/main.js
          node --check electron/preload.js

      - name: Check main-process SDK contract
        run: node scripts/check-main.cjs

      # The Groq translation cannot be tested against the live API, so the
      # fixture tests are the only thing standing between a broken translation
      # and a user discovering it.
      - name: Check provider translation
        run: node scripts/check-providers.cjs

      - name: Build renderer
        run: npm run build

      # Guards the blank-window failure mode: a build can succeed and still
      # produce absolute asset paths that break under file://.
      - name: Check build output
        run: node scripts/check-build.mjs

      # Launches the real app and asserts the wiring the checks above cannot
      # reach: contextBridge exposure, the fetch shim, IPC round-trips and the
      # production CSP. Needs no display setup on Windows, and no API key -
      # the proxy assertion is that a missing key fails correctly.
      - name: Smoke test the Electron app
        run: npx electron scripts/smoke.cjs
        timeout-minutes: 5

  # Packaging is what release.yml actually ships, and nothing in `build`
  # exercises it. Both release failures in this repo reached a real run
  # precisely because `npm run dist` never executed on a PR: one needed the
  # runner's exit-code semantics, the other needed CI to be set (electron-builder
  # auto-publishes when it detects CI, which the identical local command cannot
  # reproduce). This job is where that class of bug gets caught.
  package:
    runs-on: windows-latest

    # Deliberately not in the build matrix. release.yml pins Node 24, so
    # packaging is verified on the version that actually ships rather than on
    # both, which would double the cost to test a combination nobody releases.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist

      # release.yml uploads whatever `release/*.exe` matches. If a future
      # electron-builder left its uninstaller stub behind, that glob would
      # silently attach a second, bogus asset to a public release. Assert the
      # assumption here rather than discovering it after publishing.
      - name: Check the release artifacts
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem release/*.exe)
          if ($exes.Count -ne 1) {
            Write-Error "Expected exactly one .exe in release/, found $($exes.Count): $($exes.Name -join ', ')"
            exit 1
          }
          $exe = $exes[0]
          if ($exe.Length -lt 50MB) {
            Write-Error "$($exe.Name) is only $([math]::Round($exe.Length/1MB,1)) MB - too small to contain Electron."
            exit 1
          }
          Write-Host "Installer : $($exe.Name) - $([math]::Round($exe.Length/1MB,1)) MB"

          # release.yml publishes release/*.zip and nothing else, so both archives
          # existing is the thing that actually has to hold. Checking it here means
          # a break shows up on the PR rather than mid-release.
          $zips = @(Get-ChildItem release/*.zip)
          if ($zips.Count -ne 2) {
            Write-Error "Expected 2 zips in release/, found $($zips.Count): $($zips.Name -join ', ')"
            exit 1
          }
          if (-not ($zips.Name -match 'Setup\.zip$')) { Write-Error 'No ...-Setup.zip produced.'; exit 1 }
          if (-not ($zips.Name -match 'win\.zip$'))   { Write-Error 'No ...-win.zip produced.';   exit 1 }
          foreach ($z in $zips) { Write-Host "Asset     : $($z.Name) - $([math]::Round($z.Length/1MB,1)) MB" }
          exit 0
