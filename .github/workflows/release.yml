name: Release

# Two ways in:
#   - push a tag:  git tag v0.1.0 && git push origin v0.1.0
#   - Actions tab: "Run workflow", type the tag. gh creates the tag server-side
#     via --target, so this path needs no local tag push at all.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, e.g. v0.1.0 (must match the version in package.json)'
        required: true
        type: string

permissions:
  # Required to create the tag, the release, and to upload the installer. The
  # default token is read-only, so without this the publish step 403s.
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # A tag push carries the tag in GITHUB_REF_NAME; a manual dispatch carries
      # the *branch* there instead, so the two paths have to be reconciled before
      # anything downstream can trust the value.
      - name: Resolve the release tag
        id: rel
        shell: pwsh
        env:
          # Passed through the environment rather than interpolated into the
          # script body: `${{ inputs.tag }}` inline would be a script-injection
          # sink, since the value is arbitrary text typed into a form.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $env:INPUT_TAG.Trim()
          } else {
            $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') {
            Write-Error "Tag '$tag' is not of the form v<major>.<minor>.<patch>."
            exit 1
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $tag"

      # Publishing a tag whose artifacts carry a different version produces an
      # installer that silently contradicts its own release. Cheaper to fail here.
      - name: Check the tag matches package.json
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $tag = '${{ steps.rel.outputs.tag }}' -replace '^v', ''
          if ($pkg -ne $tag) {
            Write-Error "Tag v$tag does not match package.json version $pkg. Bump one of them."
            exit 1
          }
          Write-Host "Version $pkg matches the tag"

      # gh would fail on a duplicate anyway, but only after a full build. Fail in
      # seconds instead of after four minutes of packaging.
      - name: Check the release does not already exist
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release view '${{ steps.rel.outputs.tag }}' --json tagName *> $null
          $exists = ($LASTEXITCODE -eq 0)
          if ($exists) {
            Write-Error "Release ${{ steps.rel.outputs.tag }} already exists. Bump the version or delete it first."
            exit 1
          }
          Write-Host "No existing release for this tag"
          # `gh release view` exits non-zero when the release is absent, which is
          # the case we WANT. Write-Host does not reset $LASTEXITCODE, and the
          # runner propagates the script's trailing exit code - so without this
          # the step fails exactly when the check passes. Be explicit.
          exit 0

      - name: Install dependencies
        run: npm ci

      # The same checks CI runs on every PR. A release should not be able to ship
      # something that would have failed review.
      - name: Verify before shipping
        run: |
          node --check electron/main.js
          node --check electron/preload.js
          node --check electron/providers.js
          node scripts/check-main.cjs
          node scripts/check-providers.cjs

      # Signing is optional. With no credentials configured this produces exactly
      # the unsigned build it always did, so the pipeline keeps working until a
      # certificate actually exists.
      #
      # Azure Artifact Signing (formerly Trusted Signing) rather than a .pfx:
      # since June 2023 the CA/Browser Forum requires OV private keys to live on
      # a hardware token or HSM, so the old "put a .pfx in a secret" approach is
      # not available for a newly issued certificate. A cloud signing service is
      # the only practical CI route.
      - name: Build installer
        id: build
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
          SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
          SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
        run: |
          $configured = [bool]($env:AZURE_TENANT_ID -and $env:AZURE_CLIENT_ID -and
                               $env:AZURE_CLIENT_SECRET -and $env:SIGN_ENDPOINT -and
                               $env:SIGN_ACCOUNT -and $env:SIGN_PROFILE)

          if ($configured) {
            Write-Host 'Signing credentials present - producing a SIGNED build.'
            # Passed as CLI overrides rather than living in package.json:
            # azureSignOptions present without credentials makes electron-builder
            # fail, which would break every local and CI build.
            npm run dist -- `
              --config.win.azureSignOptions.endpoint=$env:SIGN_ENDPOINT `
              --config.win.azureSignOptions.codeSigningAccountName=$env:SIGN_ACCOUNT `
              --config.win.azureSignOptions.certificateProfileName=$env:SIGN_PROFILE
          } else {
            Write-Host 'No signing credentials configured - producing an UNSIGNED build.'
            npm run dist
          }

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "signed=$configured" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Verify the artifacts exist
        shell: pwsh
        run: |
          $exe = Get-ChildItem release/*.exe -ErrorAction SilentlyContinue
          if (-not $exe) { Write-Error "npm run dist produced no .exe"; exit 1 }
          Write-Host "Installer : $($exe.Name) ($([math]::Round($exe.Length/1MB,1)) MB)"

          # The zips are what actually get published, so a missing one must fail
          # here rather than produce a release with half its assets.
          $zips = @(Get-ChildItem release/*.zip)
          if ($zips.Count -ne 2) {
            Write-Error "Expected 2 zips in release/, found $($zips.Count): $($zips.Name -join ', ')"
            exit 1
          }
          foreach ($z in $zips) { Write-Host "Asset     : $($z.Name) ($([math]::Round($z.Length/1MB,1)) MB)" }
          exit 0

      # Publishing something advertised as signed that is not signed is worse
      # than publishing an honest unsigned build, so this fails the release when
      # signing was configured but did not take.
      - name: Report signature status
        shell: pwsh
        run: |
          $exe = @(Get-ChildItem release/*.exe)[0]
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "Installer : $($exe.Name)"
          Write-Host "Status    : $($sig.Status)"
          if ($sig.SignerCertificate) { Write-Host "Signer    : $($sig.SignerCertificate.Subject)" }

          if ('${{ steps.build.outputs.signed }}' -eq 'True' -and $sig.Status -ne 'Valid') {
            Write-Error "Signing was configured but the installer is not validly signed (status: $($sig.Status))."
            exit 1
          }
          exit 0

      - name: Publish release
        shell: pwsh
        env:
          # gh is preinstalled on GitHub runners, so this needs no third-party
          # action and no extra supply-chain surface.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Archives only. A bare .exe download is blocked or heavily warned about
          # by browsers and Windows; a .zip is not.
          $assets = (Get-ChildItem release/*.zip).FullName
          # A literal here-string (@'...'@) rather than @"..."@: PowerShell treats
          # the backtick as an escape character inside an expandable here-string,
          # which would mangle any markdown code spans in these notes.
          # Two literal here-strings rather than one interpolated: the notes
          # carry markdown, and PowerShell treats the backtick as an escape
          # character inside an expandable here-string.
          $unsignedNotes = @'
          Windows 11. Two downloads - pick one:

          **...-Setup.zip** - the installer. Unzip, run Setup, and it installs with a
          Start menu entry, a desktop shortcut and an uninstaller.

          **...-win.zip** - portable. Unzip anywhere and run Prompt-Bench.exe. Nothing
          is installed: no shortcuts, no uninstaller, and it runs from a USB stick.

          Both are archives rather than bare .exe files, because browsers and Windows
          treat a downloaded executable far more suspiciously than an archive.

          Your saved prompt library lives in %APPDATA%\Prompt-Bench either way.

          > The app is **unsigned**, so Windows SmartScreen shows "Windows protected
          > your PC" on first run. Choose **More info** then **Run anyway**.

          To build it yourself instead: npm ci, then npm run dist.
          '@

          $signedNotes = @'
          Windows 11. Two downloads - pick one:

          **...-Setup.zip** - the installer. Unzip, run Setup, and it installs with a
          Start menu entry, a desktop shortcut and an uninstaller.

          **...-win.zip** - portable. Unzip anywhere and run Prompt-Bench.exe. Nothing
          is installed: no shortcuts, no uninstaller, and it runs from a USB stick.

          Both are archives rather than bare .exe files, because browsers and Windows
          treat a downloaded executable far more suspiciously than an archive.

          Your saved prompt library lives in %APPDATA%\Prompt-Bench either way.

          > Code signed. SmartScreen builds reputation per publisher from download
          > volume, so a warning may still appear on early downloads even though the
          > signature is valid. It fades as downloads accumulate.

          To build it yourself instead: npm ci, then npm run dist.
          '@

          $notes = if ('${{ steps.build.outputs.signed }}' -eq 'True') { $signedNotes } else { $unsignedNotes }
          # --target creates the tag at this commit when it does not already
          # exist, which is what makes the manual-dispatch path work without
          # anyone pushing a tag. On a tag push the tag is already there and
          # --target is ignored.
          gh release create '${{ steps.rel.outputs.tag }}' $assets `
            --target $env:GITHUB_SHA `
            --title "Prompt-Bench ${{ steps.rel.outputs.tag }}" `
            --notes $notes
